name: Every system

# The kit on every system it runs on, with its own drivers -- what the
# headless tests (ci.yml) cannot see:
#
#   Linux    the live check under Xvfb, WebKitGTK as the browser engine;
#            the Wayland driver on sway with no screen (tests/wayland/run.sh:
#            its own mouse and keyboard, the clipboard, the pixels shown);
#            the screen driver with no windowing system (tests/kiosk/run.sh);
#            the store packages made in Nim checked with others' tools
#            (osslsigncode, jarsigner, bundletool, rcodesign: tests/store)
#   Web      an app as WebAssembly (clang and wasm-ld, no Emscripten) in
#            headless Chromium (tests/web/run.sh); the headless tests as
#            32-bit programs, an int as small as WebAssembly's (run32.sh)
#   Windows  the tests made for every system, and the live check (WinAPI,
#            WebView2); screen readers' UI Automation reading the controls
#            and pressing a button (tests/access/windows.ps1); a program
#            signed and an MSIX made in Nim, checked, installed and removed
#            by Windows itself (tests/store/windows.ps1)
#   macOS    the same with Cocoa and WKWebView; an .app signed in Nim,
#            checked by codesign and run (tests/store/mac.sh)
#   iOS      the live check in the iOS Simulator (UIKit, WKWebView)
#   Android  the live check in the Android emulator (the APK's driver and
#            its WebView)
#
# On Linux, Windows and macOS the apps are also started for real, each in a
# home of its own (tests/smoke/run.sh): left alone 3 seconds -- they must
# do next to nothing --, then clicked, keyed and typed at; a fault, a stop
# or a hang fails it, and each app's first frame time is in the log. Then
# they are driven by their controls' names (RETRO_DRIVE, tests/drive/run.sh):
# every tab clicked, every menu opened and closed, every page walked with Tab
# alone; on Linux what the tour finds (a stop Tab never reaches, a letter
# underlined twice...) fails the job too (TOUR_STRICT).
#
# The live check (tests/live/livecheck.nim) goes through the guide's pages,
# saves each frame and checks the browser engine; tools/live/compare.nim
# compares the frames with tests/live/ref (the kit draws the same pixels on
# every system). Each job uploads its pictures and results.txt, and the
# differences in red.
#
# It runs on a push to main, and by hand (Actions > Every system > Run
# workflow).

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NIM_VERSION: "2.2.6"
  # the tests that need nothing of Linux's (no X server, no D-Bus)
  PORTABLE: >-
    test_widgets test_business test_text test_bidi test_input test_records
    test_charts test_planning test_mapview test_view3d test_htmlview
    test_canvas2d test_pdf test_report test_scroll test_nestedscroll test_xlsx test_letters
    test_morecontrols test_dock test_toolcustom test_richedit test_calendar
    test_qrcode test_touchsizes test_scale test_hardening test_designer
    test_tilemap test_gltf test_store test_sysmon test_taskman
    test_inspect test_drive test_sevenguis test_navigator test_retrodns
    test_feeds test_jobs test_undo test_pages test_typeforms test_uistrings test_codeedit
    test_podcast
  # the live check: frames drawn by the CPU at 100 %, the browser engine
  # needed
  RETRO_GPU: cpu
  RETRO_SCALE: "100"
  RETRO_LIVE_WEB: need

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: X server, WebKitGTK and GStreamer
        run: |
          sh tools/apt.sh xvfb libwebkit2gtk-4.1-0 gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good gstreamer1.0-libav sway grim wl-clipboard osslsigncode
      - name: Store packages (Authenticode, MSIX, App Bundles, macOS signatures)
        run: sh tests/store/linux.sh
      - name: The Wayland driver (sway, headless; 100 % and 150 %)
        run: sh tests/wayland/run.sh
      - name: The screen driver (no windowing system; a file as the screen)
        run: sh tests/kiosk/run.sh
      - name: The 3D view on the GPU against the CPU (Mesa's OpenGL)
        run: |
          nim c -d:release --hints:off --path:src -o:build/gpu3dcheck tests/gpu3d/gpu3dcheck.nim
          RETRO_GPU=gpu xvfb-run -a -s "-screen 0 1280x800x24" build/gpu3dcheck
      - name: Live check
        run: |
          nim c -d:release --hints:off -o:build/livecheck tests/live/livecheck.nim
          xvfb-run -a -s "-screen 0 1280x800x24" env RETRO_LIVE_OUT=live RETRO_LIVE_VIDEO_NEED=1 build/livecheck
      - name: The same pixels as the reference
        if: always()
        run: nim c -r --hints:off tools/live/compare.nim live
      - name: The apps started for real (left alone, then clicked and typed at)
        if: always()
        run: |
          sh tools/apt.sh xdotool
          xvfb-run -a -s "-screen 0 1280x800x24" sh tests/smoke/run.sh
      - name: The apps driven by their controls' names (every tab, every menu)
        if: always()
        env:
          TOUR_STRICT: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24" sh tests/drive/run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-linux
          path: |
            live/
            build/smoke/*.txt

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: clang, wasm-ld, Chromium (Playwright)
        run: |
          sh tools/apt.sh clang lld
          npm install --no-save playwright
          # (its own apt-get inside: tried again as tools/apt.sh does)
          for try in 1 2 3; do npx playwright install --with-deps chromium && break; [ $try = 3 ] && exit 1; sleep 60; done
      - name: An app as a web page in a real browser (100 % and 200 %)
        run: sh tests/web/run.sh
      - name: 32-bit (an int as small as WebAssembly's)
        run: |
          sudo dpkg --add-architecture i386
          sh tools/apt.sh gcc-multilib libx11-6:i386 libxext6:i386 libxrandr2:i386 \
            libxcursor1:i386 libxi6:i386 libxfixes3:i386 libxrender1:i386 libssl3t64:i386
          sh tests/run32.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Tests
        shell: bash
        run: |
          # (the mail tests' stand-in server needs the zone database Windows'
          # Python has not)
          python3 -m pip install --quiet tzdata || python -m pip install --quiet tzdata || true
          # (every test runs, a failure or not: the log shows them all)
          failed=""
          for t in $PORTABLE; do
            echo "::group::$t"
            nim c -r --hints:off tests/$t.nim || { echo "::error::$t failed"; failed="$failed $t"; }
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }
      - name: IMAP and SMTP over the system's TLS (SChannel)
        if: always()
        continue-on-error: true
        shell: bash
        run: nim c -r --hints:off tests/test_imap.nim
      - name: Live check
        if: always()
        shell: bash
        run: |
          nim c -d:release --hints:off -o:build/livecheck.exe tests/live/livecheck.nim
          RETRO_LIVE_OUT=live ./build/livecheck.exe
      - name: Screen readers (UI Automation reads the controls, presses a button)
        if: always()
        shell: pwsh
        run: |
          nim c -d:release --hints:off -o:build/accesscheck.exe tests/access/accesscheck.nim
          ./tests/access/windows.ps1
      - name: A program signed and an MSIX, as Windows sees them
        if: always()
        shell: pwsh
        run: ./tests/store/windows.ps1
      - name: The same pixels as the reference
        if: always()
        shell: bash
        run: nim c -r --hints:off tools/live/compare.nim live
      - name: The apps started for real (left alone, then clicked and typed at)
        if: always()
        shell: bash
        run: sh tests/smoke/run.sh
      - name: The apps driven by their controls' names (every tab, every menu)
        if: always()
        shell: bash
        run: sh tests/drive/run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-windows
          path: |
            live/
            build/smoke/*.txt

  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Tests
        run: |
          # (every test runs, a failure or not: the log shows them all)
          failed=""
          for t in $PORTABLE; do
            echo "::group::$t"
            nim c -r --hints:off tests/$t.nim || { echo "::error::$t failed"; failed="$failed $t"; }
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }
      - name: IMAP and SMTP over the system's TLS (Secure Transport)
        if: always()
        continue-on-error: true
        run: nim c -r --hints:off tests/test_imap.nim
      - name: Live check
        if: always()
        run: |
          nim c -d:release --hints:off -o:build/livecheck tests/live/livecheck.nim
          RETRO_LIVE_OUT=live RETRO_LIVE_VIDEO_NEED=1 ./build/livecheck || {
            # (it stopped: again, built with its stack trace, under lldb --
            #  where it stopped is in the log)
            echo "::group::the live check again, with where it stops"
            nim c -d:release --stackTrace:on --lineTrace:on --debugger:native --hints:off \
              -o:build/livecheck-trace tests/live/livecheck.nim
            RETRO_LIVE_OUT=live RETRO_LIVE_VIDEO_NEED=1 lldb --batch -o run -k "bt 50" -k quit \
              -- ./build/livecheck-trace || true
            echo "::endgroup::"
            exit 1
          }
      - name: The same pixels as the reference
        if: always()
        run: nim c -r --hints:off tools/live/compare.nim live
      - name: The apps started for real (left alone, then clicked and typed at)
        if: always()
        run: sh tests/smoke/run.sh
      - name: The apps driven by their controls' names (every tab, every menu)
        if: always()
        run: sh tests/drive/run.sh
      - name: An .app signed in Nim, as macOS sees it
        if: always()
        run: sh tests/store/mac.sh
      - name: A picture of the screen (the system's views too)
        if: always()
        run: screencapture -x live/screen-after.png || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-macos
          path: |
            live/
            build/smoke/*.txt

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: A Simulator
        run: |
          dev=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for r in d for x in d[r] if "iOS" in r and "iPhone" in x["name"]))')
          echo "SIM=$dev" >> "$GITHUB_ENV"
          xcrun simctl boot "$dev"
          xcrun simctl bootstatus "$dev" -b
      - name: Live check in the Simulator
        run: |
          nim c -d:release --hints:off -o:build/retroios src/retroios.nim
          build/retroios tests/live/livecheck.nim --simulator --id:org.retro.livecheck --name:Livecheck \
            --nim:--path:src --run
          data=$(xcrun simctl get_app_container booted org.retro.livecheck data)
          out="$data/Library/Application Support"
          for i in $(seq 1 120); do [ -f "$out/results.txt" ] && break; sleep 1; done
          xcrun simctl io booted screenshot live-screen.png || true
          mkdir -p live && cp "$out"/*.png "$out"/results.txt live/ 2>/dev/null || true
          mv live-screen.png live/ 2>/dev/null || true
          cat live/results.txt
          ! grep -q '^FAIL' live/results.txt
      - name: The same pixels as the reference
        if: always()
        run: nim c -r --hints:off tools/live/compare.nim live
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-ios
          path: live/

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # (Android 11, and Android 15: the newest phones' rules -- edge to
        # edge, the permissions asked for at the moment)
        api: [30, 35]
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: The live check's APK (x86_64, for the emulator)
        run: |
          nim c -d:release --hints:off -o:build/retroapk src/retroapk.nim
          build/retroapk tests/live/livecheck.nim --abi:x86_64 --debuggable \
            --id:org.retro.livecheck --name:Livecheck --nim:--path:src -o:build/livecheck.apk
      - name: The apps' APKs (x86_64, for the emulator), and the tour that drives them
        run: |
          nimble emuapks -y
          nim c -d:release --hints:off --path:src -o:build/tour tests/drive/tour.nim
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Live check and every app in the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          script: sh tests/android/emulator.sh
      - name: The same pixels as the reference
        if: always()
        run: nim c -r --hints:off tools/live/compare.nim live
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-android-${{ matrix.api }}
          path: live/
