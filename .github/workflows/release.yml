name: Release

# The example apps I use and work on every day -- Retro Gallery, Retro
# Files, Retro Photo, Retro Board, Retro Mail, Retro Navigator, Retro DNS
# and 7GUIs -- built for every system and put on a GitHub release, so users
# find them ready to run:
#
#   Linux    an AppImage (one file, runs on most distributions)
#   Windows  an .exe (with its icon and version)
#   Android  an APK (arm64), and its library with its functions' names
#            (APP-symbols.zip: `retrokit symbolize` on a phone's crash report)
#   macOS    the .app, zipped
#
# It runs when a version tag is pushed (git push origin v0.20.8: the release
# of that tag), or by hand: Actions > Release > Run workflow, with a tag to
# release and, if you like, only some of the apps. The other examples are
# built only when asked, from a clone (RETRO_APP=ledger nimble exe...); a
# push to a branch and `nimble install` build none of them.
#
# APKs are signed with the key in the secrets ANDROID_KEY_PEM and
# ANDROID_CERT_DER (base64 of ~/.retro/android/debug-key.pem and
# debug-cert.der), so a new APK installs over the one before; without them
# each run makes a key of its own.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release's tag (v0.20.8); empty: build only, no release"
        required: false
        default: ""
      apps:
        description: "The apps, by their keys in retroui.nimble"
        required: false
        default: "gallery files photo board mail navigator dns sevenguis"

# Retro Mail's app registrations (examples/mail/appids.nim): repository
# secrets, so the packages sign in with one click
env:
  RETRO_MAIL_MICROSOFT_ID: ${{ secrets.RETRO_MAIL_MICROSOFT_ID }}
  RETRO_MAIL_GOOGLE_ID: ${{ secrets.RETRO_MAIL_GOOGLE_ID }}
  RETRO_MAIL_GOOGLE_SECRET: ${{ secrets.RETRO_MAIL_GOOGLE_SECRET }}

jobs:
  plan:
    # which apps, and which tag (a pushed tag, or the one given by hand)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - id: plan
        env:
          APPS: ${{ inputs.apps || 'gallery files photo board mail navigator dns sevenguis' }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          echo "apps=$(printf '%s\n' $APPS | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  linux:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: zig (links against an older glibc, for older systems)
        run: pip install ziglang
      - name: AppImage
        run: RETRO_APP=${{ matrix.app }} nimble appimage -y
      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.app }}
          path: build/*.AppImage

  windows:
    # from Linux, with MinGW: the icon and the version go into the .exe
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: MinGW
        run: sh tools/apt.sh mingw-w64
      - name: Windows program
        run: RETRO_APP=${{ matrix.app }} nimble exe -y
      - uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.app }}
          path: build/win/*.exe

  android:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Signing key
        env:
          KEY: ${{ secrets.ANDROID_KEY_PEM }}
          CERT: ${{ secrets.ANDROID_CERT_DER }}
        run: |
          if [ -n "$KEY" ] && [ -n "$CERT" ]; then
            mkdir -p "$RUNNER_TEMP/keys"
            echo "$KEY" | base64 -d > "$RUNNER_TEMP/keys/debug-key.pem"
            echo "$CERT" | base64 -d > "$RUNNER_TEMP/keys/debug-cert.der"
            echo "RETRO_KEYS=$RUNNER_TEMP/keys" >> "$GITHUB_ENV"
          else
            echo "no signing key in the secrets: this run makes one"
          fi
      - name: APK
        run: |
          RETRO_APP=${{ matrix.app }} nimble appapk -y
          # (its library with the functions' names, for `retrokit symbolize`
          # on a crash report from a phone)
          cd build
          for d in *-symbols; do [ -d "$d" ] && zip -qr "$d.zip" "$d"; done
      - uses: actions/upload-artifact@v6
        with:
          name: android-${{ matrix.app }}
          path: |
            build/*.apk
            build/*-symbols.zip

  macos:
    needs: plan
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.plan.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: macOS app
        run: RETRO_APP=${{ matrix.app }} nimble macapp -y
      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.app }}
          path: build/mac/*.zip

  release:
    # a tag: one GitHub release with every file built (what did build, when
    # one system failed: its log says why)
    if: ${{ always() && needs.plan.outputs.tag != '' }}
    needs: [plan, linux, windows, android, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          name: Retro Nim UI ${{ needs.plan.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: false
