name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # the headless tests (a fake screen driver: no display needed), a short
    # run of the fuzzers, and the Android driver on a fake Android -- with
    # Nim 2.4 (what the kit is built and released with) and with Nim 2.2
    # (still built and tested, for those who keep it)
    strategy:
      fail-fast: false
      matrix:
        nim: ["2.4.2", "2.2.6"]
    name: test (Nim ${{ matrix.nim }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        id: setupnim
        continue-on-error: true   # (a download cut off: tried once more below)
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: jiro4989/setup-nim-action@v2
        if: steps.setupnim.outcome == 'failure'
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Libraries the GPU tests load (Mesa's EGL), ccache
        run: sh tools/apt.sh libegl1 libgles2 libegl-mesa0 ccache
      - name: The C the last run built (ccache)
        # (four fifths of a test's build is the C compiler's; most of the
        # C is the same from one push to the next)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-tests-${{ matrix.nim }}-${{ github.sha }}
          restore-keys: ccache-tests-${{ matrix.nim }}-
      - name: No return after result (Nim 2.2 leaks the old value)
        run: python3 tools/returncheck.py
      - name: No var given in a branch, then again (Nim 2.2 leaks the first)
        run: python3 tools/writecheck.py
      - name: No add that reads its own seq from the end (Nim 2.4.2 reads it after it moved)
        run: python3 tools/addcheck.py
      - name: The docs name what is in the code; the guide shows every control
        run: |
          python3 tools/docscheck.py
          python3 tools/controlscheck.py
          python3 tools/tutorialshots/gen.py --check
      - name: Tests
        # (as many at once as the runner has cores; one that fails among
        # the others is run again alone: "flaky" when it passes then)
        run: |
          export PATH=/usr/lib/ccache:$PATH CCACHE_DIR=$HOME/.cache/ccache CCACHE_MAXSIZE=1500M
          ccache -z > /dev/null
          sh tests/runall.sh
          ccache -s | head -6
      - name: Fuzz (a short run)
        run: |
          nim c -r -d:release --hints:off tests/fuzz/fuzz.nim tests/fuzz/seeds 2000
          nim c -r -d:release --hints:off tests/fuzz/fuzzui.nim 200
          for f in fuzz_store fuzz_models fuzz_maps; do
            nim c -r -d:release --hints:off tests/fuzz/$f.nim 500
          done
      - name: Android driver on a fake Android
        # (Android's headers from the sysroot retroapk carries: no NDK)
        run: sh tests/android_mock/run.sh

  wasm:
    # the headless tests that need nothing of the system, as WebAssembly
    # (clang and wasm-ld, the kit's C library for the web) under Node
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        id: setupnim
        continue-on-error: true   # (a download cut off: tried once more below)
        with:
          nim-version: "2.4.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: jiro4989/setup-nim-action@v2
        if: steps.setupnim.outcome == 'failure'
        with:
          nim-version: "2.4.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: clang and wasm-ld
        run: sh tools/apt.sh clang lld
      - name: The tests as WebAssembly under Node
        run: sh tests/web/node.sh

  build:
    # the tools compile on the three desktops; the examples too, but only
    # when asked (Actions > CI > Run workflow): they are not part of the
    # toolkit's own build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        id: setupnim
        continue-on-error: true   # (a download cut off: tried once more below)
        with:
          nim-version: "2.4.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: jiro4989/setup-nim-action@v2
        if: steps.setupnim.outcome == 'failure'
        with:
          nim-version: "2.4.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Examples (only when run by hand)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p build
          for app in hello gallery notepad ledger filemanager charts invoice native photo retroboard magazine mail; do
            nim c -d:release --hints:off -o:build/$app examples/$app.nim
          done
      - name: Tools
        shell: bash
        run: |
          nim c -d:release --hints:off -o:build/retroapk src/retroapk.nim
          nim c -d:release --hints:off -o:build/retrokit src/retrokit.nim
          nim c -d:release --hints:off -o:build/retroios src/retroios.nim

  atelier-windows:
    # Retro Atelier's Windows program on every push, from Linux, to download
    # from the run's Artifacts without waiting for a release: with zig's
    # clang as the release builds it, every module optimized with the others
    # by LLVM (ThinLTO; RetroAtelier-windows; zig 0.15: 0.16 and 0.17 cannot
    # link a Windows program optimized so), and with MinGW's GCC
    # (RetroAtelier-windows-gcc: for Windows before 10, and a table of the
    # program's procs)
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, zig]
    name: atelier-windows (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        id: setupnim
        continue-on-error: true   # (a download cut off: tried once more below)
        with:
          nim-version: "2.4.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: jiro4989/setup-nim-action@v2
        if: steps.setupnim.outcome == 'failure'
        with:
          nim-version: "2.4.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: MinGW (GCC builds it, its windres makes the icon)
        if: matrix.cc == 'gcc'
        run: sh tools/apt.sh mingw-w64
      - name: zig 0.15 (its clang builds it, the icon too)
        if: matrix.cc == 'zig'
        run: pip install ziglang==0.15.2
      - name: Retro Atelier for Windows
        run: RETRO_WINCC=${{ matrix.cc }} RETRO_APP=photo nimble exe -y
      - uses: actions/upload-artifact@v6
        with:
          name: RetroAtelier-windows${{ matrix.cc == 'gcc' && '-gcc' || '' }}
          path: build/win/*.exe
          retention-days: 30
