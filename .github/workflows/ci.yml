name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # the headless tests (a fake screen driver: no display needed), a short
    # run of the fuzzers, and the Android driver on a fake Android
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Libraries the GPU tests load (Mesa's EGL)
        run: sh tools/apt.sh libegl1 libgles2 libegl-mesa0
      - name: No return after result (Nim 2.2 leaks the old value)
        run: python3 tools/returncheck.py
      - name: No var given in a branch, then again (Nim 2.2 leaks the first)
        run: python3 tools/writecheck.py
      - name: The docs name what is in the code; the guide shows every control
        run: |
          python3 tools/docscheck.py
          python3 tools/controlscheck.py
      - name: Tests
        run: nimble test -y
      - name: Fuzz (a short run)
        run: |
          nim c -r -d:release --hints:off tests/fuzz/fuzz.nim tests/fuzz/seeds 2000
          nim c -r -d:release --hints:off tests/fuzz/fuzzui.nim 200
          for f in fuzz_store fuzz_models fuzz_maps; do
            nim c -r -d:release --hints:off tests/fuzz/$f.nim 500
          done
      - name: Android driver on a fake Android
        # (Android's headers from the sysroot retroapk carries: no NDK)
        run: sh tests/android_mock/run.sh

  wasm:
    # the headless tests that need nothing of the system, as WebAssembly
    # (clang and wasm-ld, the kit's C library for the web) under Node
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: clang and wasm-ld
        run: sh tools/apt.sh clang lld
      - name: The tests as WebAssembly under Node
        run: sh tests/web/node.sh

  build:
    # the tools compile on the three desktops; the examples too, but only
    # when asked (Actions > CI > Run workflow): they are not part of the
    # toolkit's own build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: "2.2.6"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Examples (only when run by hand)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p build
          for app in hello gallery notepad ledger filemanager charts invoice native photo retroboard magazine mail; do
            nim c -d:release --hints:off -o:build/$app examples/$app.nim
          done
      - name: Tools
        shell: bash
        run: |
          nim c -d:release --hints:off -o:build/retroapk src/retroapk.nim
          nim c -d:release --hints:off -o:build/retrokit src/retrokit.nim
          nim c -d:release --hints:off -o:build/retroios src/retroios.nim
