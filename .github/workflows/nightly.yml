name: Nightly

# What takes too long for every push, every night:
#
#   sanitizers  the headless tests under AddressSanitizer and UBSan (leaks
#               too: tests/lsan.supp names the few that are not the kit's)
#   fuzz        the mutation fuzzers, long runs, under the sanitizers
#   libfuzzer   the decoders under libFuzzer (tests/fuzz/libfuzz.nim):
#               coverage-guided, five minutes a target
#   32-bit      the headless tests as 32-bit programs under UBSan: an int as
#               small as WebAssembly's, a shift of 32 that is undefined in C
#   wasm        the headless tests that need nothing of the system as
#               WebAssembly under Node (tests/web/node.sh)
#
# A crash's input is uploaded (Actions > the run > Artifacts).

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  NIM_VERSION: "2.2.6"

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Libraries the tests load
        run: sh tools/apt.sh clang libegl1 libgles2 libegl-mesa0
      - name: The headless tests under ASan and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1
          RETRO_TEST_OUT: build/san
        run: |
          LSAN_OPTIONS=suppressions=$PWD/tests/lsan.supp \
          RETRO_TEST_FLAGS="--warnings:off --cc:clang -d:useMalloc -d:retroSanitized --debugger:native --passC:-fsanitize=address,undefined --passC:-fno-omit-frame-pointer --passC:-fno-sanitize=function --passL:-fsanitize=address,undefined" \
          sh tests/runall.sh

  flaky:
    # every headless test three times over, as many at once as there are
    # cores: one that fails in a round and passes in another is named, and
    # fails this job (tests/runall.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Libraries the tests load
        run: sh tools/apt.sh libegl1 libgles2 libegl-mesa0
      - name: Each test three times
        env:
          RETRO_REPEAT: "3"
          RETRO_FLAKY_FAILS: "1"
        run: sh tests/runall.sh
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: flaky-logs
          path: build/tests/*.log

  soak:
    # each app worked for an hour by the kit's random input (clicks,
    # keys, typing; an Exit clicked does not end it), its memory sampled:
    # one that keeps growing once warm, or that faults, fails (tools/soak.sh;
    # each app in a home of its own on a runner that is thrown away; not
    # Retro Board nor Retro Navigator: the clicks keep adding shapes, or
    # opening tabs, and their memory grows with what they hold)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        app: [gallery, filemanager, photo, mail, retrodns, podcast, grow, taskman]
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: X server
        run: sh tools/apt.sh xvfb
      - name: Soak
        run: xvfb-run -a -s "-screen 0 1280x800x24" sh tools/soak.sh 60 ${{ matrix.app }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: soak-${{ matrix.app }}
          path: build/soak/

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sh tools/apt.sh clang
      - name: The mutation fuzzers, long, under the sanitizers
        run: |
          SAN='--cc:clang -d:useMalloc -d:retroSanitized --debugger:native --passC:-fsanitize=address,undefined --passC:-fno-sanitize=function --passL:-fsanitize=address,undefined'
          mkdir -p crashes && cd crashes
          ASAN_OPTIONS=detect_leaks=0 nim c -r -d:release --hints:off $SAN ../tests/fuzz/fuzz.nim ../tests/fuzz/seeds 200000
          ASAN_OPTIONS=detect_leaks=0 nim c -r -d:release --hints:off $SAN ../tests/fuzz/fuzzui.nim 5000
          for f in fuzz_store fuzz_models fuzz_maps fuzz_media fuzz_photo fuzz_report fuzz_view3d fuzz_htmlview fuzz_charts fuzz_canvas2d; do
            ASAN_OPTIONS=detect_leaks=0 nim c -r -d:release --hints:off $SAN ../tests/fuzz/$f.nim 20000
          done
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: fuzz-crashes
          path: crashes/

  libfuzzer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [png, bmp, jpg, webp, inflate, md, html, pdf, gltf, mvt, lzma, feed, chapters, transcript, board]
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sh tools/apt.sh clang
      - name: Build
        run: |
          mkdir -p build
          nim c --cc:clang --noMain -d:useMalloc -d:release --debugger:native --hints:off \
            --passC:"-fsanitize=fuzzer,address,undefined -fno-sanitize=function" \
            --passL:"-fsanitize=fuzzer,address,undefined" \
            -d:fuzzTarget=${{ matrix.target }} -o:build/lf tests/fuzz/libfuzz.nim
      - name: Five minutes of it
        run: |
          mkdir -p corpus crashes
          cd crashes && ../build/lf -max_total_time=300 -rss_limit_mb=4096 ../corpus ../tests/fuzz/seeds
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: libfuzzer-${{ matrix.target }}
          path: crashes/

  thirty-two-bit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: The 32-bit libraries
        run: |
          sudo dpkg --add-architecture i386
          sh tools/apt.sh gcc-multilib libx11-6:i386 libxext6:i386 libxrandr2:i386 libxcursor1:i386 libxi6:i386 libssl3:i386
      - name: The headless tests as 32-bit programs, under UBSan
        run: RETRO32_UBSAN=1 sh tests/run32.sh

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ env.NIM_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: clang and wasm-ld
        run: sh tools/apt.sh clang lld
      - name: The headless tests as WebAssembly under Node
        run: sh tests/web/node.sh
